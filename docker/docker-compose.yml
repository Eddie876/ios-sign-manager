services:
  sign-manager:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - signmanager-data:/data
      - signmanager-signing-state:/signing-state
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      - anisette

  sign-manager-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["dotnet", "worker/SignManager.Worker.dll"]
    volumes:
      - signmanager-data:/data
      - signmanager-signing-state:/signing-state
    depends_on:
      - anisette

  anisette:
    image: dadoum/anisette-v3-server:latest
    restart: unless-stopped

volumes:
  signmanager-data:
  signmanager-signing-state:
